name: Nodi checks and builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - run: go vet ./...
      - run: go test -race -cover ./...
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Build standalone binaries
        shell: bash
        run: |
          mkdir -p dist
          export CGO_ENABLED=0
          GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w -buildid= -X main.version=0.1.0' -o dist/nodi-windows-amd64.exe ./cmd/nodi
          GOOS=darwin GOARCH=arm64 go build -trimpath -buildvcs=false -ldflags='-s -w -buildid= -X main.version=0.1.0' -o dist/nodi-darwin-arm64 ./cmd/nodi
          GOOS=darwin GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w -buildid= -X main.version=0.1.0' -o dist/nodi-darwin-amd64 ./cmd/nodi
          cd dist
          sha256sum nodi-* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: nodi-0.1.0
          path: dist/*
          if-no-files-found: error
