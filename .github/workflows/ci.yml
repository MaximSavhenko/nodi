name: Nodi validation and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nodi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Resolve stable version and tag ancestry
        id: version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $version = '0.4.1'
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Only stable version tags can be released.' }
            $version = $env:REF_NAME.Substring(1)
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Release commit must belong to reviewed main history.' }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: go vet ./...
      - run: go test -cover ./...
      - name: Build and generate distribution
        shell: pwsh
        run: |
          ./scripts/build.ps1 -Version '${{ steps.version.outputs.version }}'
          ./scripts/generate-distribution.ps1 -Version '${{ steps.version.outputs.version }}' -Owner '${{ github.repository_owner }}' -License MIT
          ./scripts/verify-distribution.ps1 -Version '${{ steps.version.outputs.version }}' -Platform windows-amd64
      - name: Validate winget manifests
        shell: pwsh
        run: |
          winget validate --manifest 'packaging/winget/manifests/m/${{ github.repository_owner }}/Nodi/${{ steps.version.outputs.version }}'
          if ($LASTEXITCODE -ne 0) { throw 'winget validation failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: nodi-distribution
          path: dist/*
          if-no-files-found: error
  native:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-amd64
          - os: macos-15
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - run: go vet ./...
      - run: go test -cover ./...
      - name: Race checks on macOS
        if: runner.os == 'macOS'
        run: go test -race ./...
      - uses: actions/download-artifact@v4
        with:
          name: nodi-distribution
          path: dist
      - name: Execute the exact release binary without developer tools in PATH
        shell: pwsh
        run: ./scripts/verify-distribution.ps1 -Version '${{ needs.build.outputs.version }}' -Platform '${{ matrix.platform }}'
      - name: Test actual PowerShell completion
        shell: pwsh
        run: ./scripts/test-completion.ps1 -Binary './dist/nodi-${{ matrix.platform }}${{ runner.os == 'Windows' && '.exe' || '' }}'
      - name: Upgrade the existing Windows installation and preserve user data
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NODI_INSTALL_TOKEN: ${{ github.token }}
        run: ./scripts/test-windows-upgrade.ps1 -Version '${{ needs.build.outputs.version }}'
      - name: Test actual bash and zsh completion widgets
        if: runner.os == 'macOS'
        run: python3 scripts/test-shell-completion.py './dist/nodi-${{ matrix.platform }}'
      - name: Upgrade macOS 0.3.0 and preserve user data
        if: runner.os == 'macOS'
        run: bash scripts/test-macos-upgrade.sh '${{ needs.build.outputs.version }}' "$PWD/dist"
      - name: Test fresh PowerShell 5.1 and 7 startup with real profiles
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/test-persistent-completion.ps1 -Binary './dist/nodi-windows-amd64.exe' -Shell (Get-Process -Id $PID).Path -ConfigureProfiles
          ./scripts/test-persistent-completion.ps1 -Binary './dist/nodi-windows-amd64.exe' -Shell "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -ConfigureProfiles
      - name: Test fresh Zsh startup and literal Tab after setup
        if: runner.os == 'macOS'
        run: python3 scripts/test-persistent-zsh.py './dist/nodi-${{ matrix.platform }}'
      - name: Test local Homebrew formula and fresh Zsh startup
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          set -euo pipefail
          # Use this build's ZIPs in a temporary local tap; never publish a formula/release.
          brew tap-new nodi-test/local
          tap_root="$(brew --repo nodi-test/local)"
          python3 - "$PWD" "$tap_root" <<'PY'
          from pathlib import Path
          import re, sys
          root, tap = map(Path, sys.argv[1:])
          formula = (root / 'dist/nodi.rb').read_text()
          formula = re.sub(r'https://github.com/[^" ]+/releases/download/v[0-9.]+/(nodi-darwin-[a-z0-9]+\.zip)', lambda m: (root / 'dist' / m[1]).as_uri(), formula)
          (tap / 'Formula/nodi.rb').write_text(formula)
          PY
          brew install nodi-test/local/nodi
          brew test nodi-test/local/nodi
          python3 scripts/test-persistent-zsh.py "$(brew --prefix)/bin/nodi" --homebrew
          brew reinstall nodi-test/local/nodi
          python3 scripts/test-persistent-zsh.py "$(brew --prefix)/bin/nodi" --homebrew
          brew uninstall nodi-test/local/nodi
          brew untap nodi-test/local
      - name: Verify installer preserves profiles unless explicitly requested
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          test_home="$(mktemp -d "$RUNNER_TEMP/nodi-profile.XXXXXXXX")"
          trap 'rm -rf "$test_home"' EXIT
          printf 'existing user configuration\n' > "$test_home/.zprofile"
          cp "$test_home/.zprofile" "$test_home/profile-before"
          HOME="$test_home" ZDOTDIR="$test_home" sh scripts/install-macos.sh --bundle "$PWD/dist" --no-completion
          cmp "$test_home/.zprofile" "$test_home/profile-before"
          HOME="$test_home" ZDOTDIR="$test_home" sh scripts/install-macos.sh --bundle "$PWD/dist" --add-path --no-completion
          grep -Fqx 'export PATH="$HOME/.local/bin:$PATH"' "$test_home/.zprofile"
          cp "$test_home/.zprofile" "$test_home/profile-after"
          HOME="$test_home" ZDOTDIR="$test_home" sh scripts/install-macos.sh --bundle "$PWD/dist" --add-path --no-completion
          cmp "$test_home/.zprofile" "$test_home/profile-after"
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: nodi-distribution
          path: dist
      - name: Verify artifacts and generate confirmation receipt
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ./scripts/verify-distribution.ps1 -Version $env:RELEASE_VERSION -SkipRuntime
          $receipt = Get-Content ./dist/build-metadata.json -Raw | ConvertFrom-Json
          if ($receipt.source_commit -cne $env:SOURCE_COMMIT) { throw 'Source commit mismatch.' }
          $receipt.confirmed = $true
          $receipt | Add-Member -NotePropertyName checks -NotePropertyValue @('windows-amd64','darwin-arm64','darwin-amd64','winget-validate')
          $receipt | Add-Member -NotePropertyName workflow_url -NotePropertyValue $env:RUN_URL
          $receipt | ConvertTo-Json -Depth 10 | Set-Content ./dist/validation.json -Encoding utf8NoBOM
      - name: Publish only validated binaries, starting with a draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'A release for this tag already exists; replacement is forbidden.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Nodi $RELEASE_TAG" --notes-file "docs/RELEASE-${RELEASE_TAG#v}.md" dist/nodi-windows-amd64.exe dist/nodi-windows-amd64.zip dist/nodi-darwin-arm64 dist/nodi-darwin-arm64.zip dist/nodi-darwin-amd64 dist/nodi-darwin-amd64.zip dist/SHA256SUMS dist/nodi.rb dist/winget-manifests.zip dist/validation.json scripts/install-windows.ps1 scripts/install-macos.sh LICENSE
          gh release edit "$RELEASE_TAG" --draft=false --latest
  winget-install:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, native, publish]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate and install the exact published portable package
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: ./scripts/test-winget-install.ps1 -Version $env:VERSION -Owner $env:OWNER
